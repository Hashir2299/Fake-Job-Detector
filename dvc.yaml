stages:
  train:
    cmd: python -m src.pipeline.training_pipeline
    deps:
      - data/raw/fake_job_postings.csv
      - src
      - config/model.yaml
      - config/schema.yaml
    outs:
      - data/processed/fake_job_postings_clean.csv
      - models/fake_job_model.pkl
    metrics:
      - models/metrics.json
